[build-system]
requires = ["setuptools>=68,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-imaging-inference"
version = "0.1.0"
description = "Approved-model inference API for medical imaging research artifacts"
requires-python = ">=3.10,<3.11"
dependencies = ["fastapi==0.115.8", "uvicorn==0.34.0", "python-multipart==0.0.20",
                "Pillow==11.3.0", "numpy==2.0.2", "PyJWT[crypto]==2.10.1",
                "httpx==0.28.1", "pydantic==2.10.6", "SQLAlchemy>=2.0,<2.1",
                "medical-imaging-platform-contracts @ git+https://github.com/scientific7/Medical_Inference_Application.git@bc2739eb17f5208e680da707bd15319615f7bad2#subdirectory=packages/contracts"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
postgres = ["psycopg[binary]>=3.2,<4"]
aws = ["boto3>=1.35,<2"]
frontend = ["streamlit==1.49.1"]
pytorch = ["torch==2.5.1", "torchvision==0.20.1"]
tensorflow = ["tensorflow==2.18.0"]

[project.scripts]
medical-imaging-inference = "medical_imaging_inference.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
