name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install ruff
      - run: ruff check src apps tests
      - run: ruff format --check src apps tests

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python scripts/check-doc-links.py

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=deployment/terraform fmt -check
      - run: terraform -chdir=deployment/terraform init -backend=false
      - run: terraform -chdir=deployment/terraform validate
      - run: bash -n deployment/scripts/deploy.sh

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e '.[test,aws]'
      - run: python -m pytest -q tests/test_preprocessing.py tests/test_postprocessing.py tests/test_security.py tests/test_runtime.py tests/test_storage.py tests/test_visualizations.py

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: inference_test
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: inference_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U inference_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 8
    env:
      INFERENCE_TEST_POSTGRES_URL: postgresql+psycopg://inference_test:test-only@localhost:5432/inference_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e '.[test,postgres,aws]'
      - run: python -m pytest -q tests/test_batches.py tests/test_deadlines.py tests/test_datasets.py tests/test_evaluations.py tests/test_history.py tests/test_http_limits.py tests/test_postgres.py tests/test_registry.py

  framework-smoke:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - framework: pytorch
            module: torch
          - framework: tensorflow
            module: tensorflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -e '.[test,${{ matrix.framework }}]'
      - run: python -c 'import ${{ matrix.module }}'
      - run: python -m pytest -q tests/test_local_lifecycle.py -k '${{ matrix.framework }}'
      - if: matrix.framework == 'pytorch'
        run: python -m pytest -q tests/test_runtime.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -e '.[test,frontend]'
      - run: python -m pytest -q tests/test_frontend.py tests/test_visualizations.py

  docker:
    runs-on: ubuntu-latest
    env:
      INFERENCE_ENV_FILE: .env.example
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config -q
      - run: docker compose --env-file .env.example build
      - run: docker compose --env-file .env.example up -d --wait
      - run: curl --fail http://127.0.0.1:8000/health && curl --fail http://127.0.0.1:8501/_stcore/health
      - if: always()
        run: docker compose --env-file .env.example down
